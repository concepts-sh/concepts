server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/html text/css text/plain text/markdown application/javascript image/svg+xml;

    # /spec serves spec.html, so links work with or without the extension.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Markdown mirrors and llms.txt, for agents.
    location ~ \.md$ {
        types { text/markdown md; }
        default_type text/markdown;
    }

    # The stylesheet and icons carry a content hash in their URL, so they can be cached;
    # the bare /favicon.ico that browsers request on their own is kept short.
    location = /style.css {
        add_header Cache-Control "public, max-age=86400";
    }
    location ~ \.(ico|png|svg)$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
