server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/html text/css text/plain text/markdown application/javascript image/svg+xml;

    # Clean URLs: /spec serves spec.html, and the old .html addresses redirect to the clean ones.
    # The checks use $request_uri, the URI the client asked for, so nginx's own internal
    # rewrite of / to /index.html does not trigger them.
    location / {
        if ($request_uri ~ ^/index\.html$) { return 302 /; }
        if ($request_uri ~ ^/(.+)\.html$) { return 302 /$1; }
        try_files $uri $uri.html $uri/ =404;
    }

    # Markdown mirrors and llms.txt, for agents.
    location ~ \.md$ {
        types { text/markdown md; }
        default_type text/markdown;
    }

    # The stylesheet and icons carry a content hash in their URL, so they can be cached;
    # the bare /favicon.ico that browsers request on their own is kept short.
    location = /style.css {
        add_header Cache-Control "public, max-age=86400";
    }
    location ~ \.(ico|png|svg)$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
